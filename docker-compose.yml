name: finance-application

services:

  finance-service:
    image: lubospodkidos/finance-service:latest
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres-finance:
        condition: service_healthy
    environment:
      - FINANCE_DB_URL=${FINANCE_DB_URL}
      - FINANCE_DB_USER=${FINANCE_DB_USER}
      - FINANCE_DB_PASSWORD=${FINANCE_DB_PASSWORD}
    ports:
      - "${FINANCE_SERVICE_PORT}:8080"
    healthcheck:
      test: >
        wget --no-verbose --tries=1 --spider
        http://localhost:8080/actuator/health/liveness
        || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - db-net


  postgres-finance:
    image: postgres:18-alpine
    container_name: postgres_finance_db
    environment:
      POSTGRES_USER: ${FINANCE_DB_USER}
      POSTGRES_PASSWORD: ${FINANCE_DB_PASSWORD}
      POSTGRES_DB: finance_db
    ports:
      - "${FINANCE_DB_PORT}:5432"
    volumes:
      - pgdata-finance:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${FINANCE_DB_USER} -d finance_db" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
      start_interval: 3s
    restart: unless-stopped
    networks:
      - db-net

networks:
  db-net:

volumes:
  pgdata-finance: